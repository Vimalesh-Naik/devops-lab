services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: ./app
    image: devops-lab:v1
    environment:
      REDIS_HOST: redis
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:80:80"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:

networks:
  backend:
    driver: bridge

